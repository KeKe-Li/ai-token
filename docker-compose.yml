services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aitoken
      POSTGRES_PASSWORD: aitoken
      POSTGRES_DB: aitoken
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/gateway/migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitoken"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./services/gateway
      dockerfile: ../../deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://aitoken:aitoken@postgres:5432/aitoken?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32bytes!!!!!}
      ALLOWED_ORIGINS: http://localhost:3000
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://gateway:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
